# Docker Compose configuration for eru-ql testing

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: eru-ql-postgres-test
    environment:
      POSTGRES_DB: eru_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./postgres-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eru_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eru-test-network

  mysql-test:
    image: mysql:8.0
    container_name: eru-ql-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: eru_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eru-test-network

  # Test runner service using official Go image (avoids build context issues)
  test-runner:
    image: golang:1.22-alpine
    container_name: eru-ql-test-runner
    depends_on:
      postgres-test:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
    environment:
      # PostgreSQL connection
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: eru_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_SCHEMA: public
      
      # MySQL connection
      MYSQL_HOST: mysql-test
      MYSQL_PORT: 3306
      MYSQL_DB: eru_test
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      
      # Test configuration
      TEST_ENV: ci
      TEST_DEBUG: "false"
      SKIP_SLOW_TESTS: "false"
      PARALLEL_TESTS: "false"
      TEST_DATA_PATH: /app/testdata
      
      # Go configuration to avoid module issues
      GOPROXY: direct
      GOSUMDB: off
    volumes:
      - .:/app
      - test_results:/app/test-results
    working_dir: /app
    command: ["sh", "-c", "apk add --no-cache git && go test -v -timeout 10m ./demo_test.go"]
    networks:
      - eru-test-network

  # Test database cleanup service
  cleanup:
    image: alpine:latest
    container_name: eru-ql-test-cleanup
    volumes:
      - postgres_test_data:/postgres_data
      - mysql_test_data:/mysql_data
    command: |
      sh -c "
        echo 'Cleaning up test data...'
        rm -rf /postgres_data/*
        rm -rf /mysql_data/*
        echo 'Cleanup completed'
      "
    networks:
      - eru-test-network

volumes:
  postgres_test_data:
    driver: local
  mysql_test_data:
    driver: local
  test_results:
    driver: local

networks:
  eru-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16